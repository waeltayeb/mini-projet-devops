name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push user-service
      - name: Build & Push user-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest ./user-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      # Build & push salle-service
      - name: Build & Push salle-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/salle-service:latest ./salle-service
          docker push ${{ secrets.DOCKER_USERNAME }}/salle-service:latest

      # Build & push reservation-service
      - name: Build & Push reservation-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/reservation-service:latest ./reservation-service
          docker push ${{ secrets.DOCKER_USERNAME }}/reservation-service:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > $HOME/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v3

      # Deploy user-service
      - name: Deploy user-service with Helm
        run: |
          helm upgrade --install user-service ./helm/user-service \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/user-service \
            --set image.tag=latest

      # Deploy salle-service
      - name: Deploy salle-service with Helm
        run: |
          helm upgrade --install salle-service ./helm/salle-service \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/salle-service \
            --set image.tag=latest

      # Deploy reservation-service
      - name: Deploy reservation-service with Helm
        run: |
          helm upgrade --install reservation-service ./helm/reservation-service \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/reservation-service \
            --set image.tag=latest
